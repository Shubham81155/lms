# clamd settings for the scan profile. Uploads are streamed with INSTREAM, which clamd caps at StreamMaxLength
# (default 25M). It must be at least UPLOAD_MAX_MB (default 100); a larger upload gets "INSTREAM size limit
# exceeded" and the API refuses it (503) rather than treat it as clean. MaxFileSize/MaxScanSize must not be lower
# than the stream limit or the file is only partly scanned. Raise all three together with UPLOAD_MAX_MB, keeping
# StreamMaxLength <= MaxFileSize <= MaxScanSize (the values below leave headroom over the 100 MB default).
Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 128M
MaxFileSize 128M
MaxScanSize 256M
# Scan threads; each concurrent scan can use up to MaxScanSize of memory when unpacking archives, so keep this
# modest on a 2-3 GB host. Default is 10.
MaxThreads 4
# Long enough for a 100 MB stream over a slow link (default 120 s idle for reads, 30 s for commands).
CommandReadTimeout 60
ReadTimeout 120
