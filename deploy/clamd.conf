# clamd settings for the scan profile. StreamMaxLength must be at least UPLOAD_MAX_MB (default 100), or uploads of
# that size are refused (503). Raise all three together with UPLOAD_MAX_MB.
Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 128M
MaxFileSize 128M
MaxScanSize 256M
