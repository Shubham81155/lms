# Prometheus for docker-compose.prod.yml (profile "monitoring"). The container's entrypoint writes METRICS_TOKEN (the
# same value the API checks on GET /metrics) to /tmp/metrics_token before starting, so no secret is in this file.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lms-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:4000"]

  # The backup service serves the freshness of the last backup (backup.sh writes /backups/metrics/backup.txt).
  - job_name: lms-backup
    metrics_path: /backup.txt
    static_configs:
      - targets: ["backup:9199"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
